name: DeepGraph AI CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Backend Pytest Suite with Coverage
        run: |
          pytest apps/api/tests -v --cov=apps/api/app --cov-report=term --cov-report=xml

      - name: Run Quantitative Evaluation & Health Probes
        run: |
          python scripts/seed_sample_papers.py
          python scripts/evaluate_retrieval.py
          python scripts/graph_health_check.py

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Build Frontend Next.js Production App
        working-directory: apps/web
        run: npm run build
