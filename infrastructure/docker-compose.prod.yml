version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deepgraph-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepgraph_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-deepgraph}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepgraph"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: deepgraph-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: deepgraph-neo4j-prod
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-deepgraph_graph_pass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_prod_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: deepgraph-api-prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deepgraph}:${POSTGRES_PASSWORD:-deepgraph_secure_pwd}@postgres:5432/${POSTGRES_DB:-deepgraph}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-deepgraph_graph_pass}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: deepgraph-web-prod
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: deepgraph-nginx-prod
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres_prod_data:
  redis_prod_data:
  neo4j_prod_data:
